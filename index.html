<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Gestor de Tareas Profesional</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>TaskFlow</h1>
        <p>Sistema de gestión de actividades y productividad personal</p>
    </header>

    <main>
        <!-- Formulario para Crear / Editar Tareas -->
        <section class="task-form">
            <h2 id="formTitle">Nueva Tarea</h2>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                
                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Título de la tarea (mínimo 3 caracteres)"
                    required
                >

                <textarea
                    id="taskDescription"
                    placeholder="Descripción detallada de la tarea..."
                ></textarea>

                <div class="form-row">
                    <select id="taskCategory">
                        <option value="Trabajo">Trabajo</option>
                        <option value="Estudio" selected>Estudio</option>
                        <option value="Personal">Personal</option>
                        <option value="Proyectos">Proyectos</option>
                    </select>

                    <select id="taskPriority">
                        <option value="baja">Baja</option>
                        <option value="media" selected>Media</option>
                        <option value="alta">Alta</option>
                    </select>

                    <input
                        type="date"
                        id="taskDate"
                    >
                </div>

                <div class="form-actions-submit">
                    <button type="submit" id="btnSubmit">Agregar Tarea</button>
                    <button type="button" id="btnCancelEdit" class="btn-secondary hidden">Cancelar Edición</button>
                </div>
            </form>
        </section>

        <!-- Dashboard de Estadísticas -->
        <section class="dashboard">
            <div class="stat">
                <span id="totalTasks">0</span>
                <p>Total</p>
            </div>
            <div class="stat">
                <span id="pendingTasks">0</span>
                <p>Pendientes</p>
            </div>
            <div class="stat">
                <span id="completedTasks">0</span>
                <p>Completadas</p>
            </div>
        </section>

        <!-- Búsqueda y Filtros -->
        <section class="filters">
            <input
                type="text"
                id="searchTask"
                placeholder="Buscar por título o descripción..."
            >

            <select id="filterStatus">
                <option value="all">Todos los estados</option>
                <option value="pending">Pendientes</option>
                <option value="completed">Completadas</option>
                <option value="overdue">Vencidas</option>
            </select>

            <select id="filterCategory">
                <option value="all">Todas las categorías</option>
                <option value="Trabajo">Trabajo</option>
                <option value="Estudio">Estudio</option>
                <option value="Personal">Personal</option>
                <option value="Proyectos">Proyectos</option>
            </select>
        </section>

        <!-- Lista de Tareas -->
        <section>
            <h2>Mis Tareas</h2>
            <div id="taskList"></div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
